# The production stack on the server. From the folder that holds backend/ and frontend/:
#   docker compose -f backend/compose.yml up -d --build
# Settings come from backend/.env (the filled-in prod.env). Only Caddy (web) is reachable from outside.
name: tv-pirate

x-logging: &logging
  driver: local # rotates by itself; Docker's default log driver grows until the disk is full

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: tv-pirate
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d tv-pirate"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - subtitles:/app/data/subtitles
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

volumes:
  db-data:
  subtitles:
  caddy-data:
  caddy-config:
