spring.application.name=backend

# Local secrets from .env (gitignored); run from the backend folder so the relative path resolves.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT}/tv-pirate
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Every schema change is a Liquibase migration (db/changelog/); Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
# Off by default: the JWT filter queries the user on every request.
spring.jpa.show-sql=${SHOW_SQL:false}

# Baseline changesets are MARK_RAN on the pre-Liquibase dev DB; a fresh DB runs everything.
spring.liquibase.change-log=classpath:db/changelog/master.yaml

server.port=8080

# Below Boot's 200 threads, since Postgres shares the VM; raising threads means raising the at-once caps in RateLimitPolicy too.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
server.tomcat.threads.max=100

jwt.secret=${JWT_SECRET}
jwt.access-minutes=${JWT_ACCESS_MINUTES:15}
jwt.refresh-days=${JWT_REFRESH_DAYS:30}

# Comma-separated frontend origins allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# true in production: HTTPS-only auth cookies.
app.cookie.secure=${COOKIE_SECURE:false}

# Without credentials the Google button bounces back with signInError=unavailable.
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
# Must exactly match an "Authorised redirect URI" on the OAuth client.
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
# Without it guest creation skips the bot check, so prod must set it. vault:rate-limiting-deep-dive#vpn
turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
# Where a redirect sign-in lands the browser.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Inactive guests are deleted daily with everything they own.
app.guest-retention-days=${GUEST_RETENTION_DAYS:7}
app.guest-cleanup-cron=${GUEST_CLEANUP_CRON:0 17 3 * * *}
# Expired refresh tokens of any account; the guest sweep only removes its own guests' tokens.
app.token-cleanup-cron=${TOKEN_CLEANUP_CRON:0 32 3 * * *}

# The v4 read token works as a Bearer on the v3 API, keeping the key out of URLs.
tmdb.base-url=https://api.themoviedb.org/3
tmdb.read-access-token=${TMDB_READ_ACCESS_TOKEN}

# Subtitles are cached on disk: download links expire and the daily quota is small. vault:streaming-providers-deep-dive#subtitles
opensubtitles.api-key=${OPENSUBTITLES_API_KEY:}
app.subtitle-cache-dir=${SUBTITLE_CACHE_DIR:data/subtitles}

# Health only; show-details=always is what makes /actuator/health/db resolve.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Boot defaults, pinned so the container's /error page can't leak details by accident. vault:error-handling-deep-dive#defence-in-depth
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Master switch only (numbers live in RateLimitPolicy); false for local scripted runs. vault:rate-limiting-deep-dive#policies
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# Trusts X-Forwarded-For only from a private/loopback peer (Caddy), so clients can't spoof their IP. vault:rate-limiting-deep-dive#client-ip
server.forward-headers-strategy=native
