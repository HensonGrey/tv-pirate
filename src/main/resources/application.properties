spring.application.name=backend

# Load local secrets from backend/.env (gitignored — never commit real values).
# Run the app from the backend/ folder so the relative path resolves.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL connection — values come from .env (DB_HOST defaults to localhost)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT}/tv-pirate
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema changes live in src/main/resources/db/changelog/ and are applied by
# Liquibase at startup. Hibernate only VALIDATES that the entities match the
# schema — it never alters the DB. RULE: a DB change MUST be a migration, and
# every changeset defines its rollback (--rollback line) like TypeORM's down().
spring.jpa.hibernate.ddl-auto=validate
# Off by default — the JWT filter loads the user on every authenticated
# request, so this would print a query per API call forever. Set SHOW_SQL=true
# locally when debugging.
spring.jpa.show-sql=${SHOW_SQL:false}

# Liquibase: the baseline changesets carry tableExists preconditions with
# onFail:MARK_RAN, so the pre-migration dev DB gets baselined without running
# them, while a fresh database executes everything from the top.
spring.liquibase.change-log=classpath:db/changelog/master.yaml

server.port=8080

# Sized for a Pi hosting several apps, not a box this JVM owns alone — the
# untuned defaults (10 idle Postgres connections, 200 Tomcat threads) are
# wasteful for an app whose entire cache ceiling is under 50MB and that
# expects at most a handful of concurrent users. The other lever, JVM max
# heap, isn't a property here — it's a -Xmx512m flag on whatever actually
# starts the jar (e.g. a systemd unit's ExecStart) once one exists.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
server.tomcat.threads.max=50

# JWT settings — secret comes from .env
jwt.secret=${JWT_SECRET}
jwt.access-minutes=${JWT_ACCESS_MINUTES:15}
jwt.refresh-days=${JWT_REFRESH_DAYS:30}

# CORS: which frontend origins may call the API (comma-separated).
# Defaults to the Vite dev server; set CORS_ALLOWED_ORIGINS in the
# environment when deploying (no code change needed).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Auth cookies: the Secure flag makes the browser only send them over HTTPS.
# Localhost dev runs plain HTTP, so keep this false; set COOKIE_SECURE=true
# in production.
app.cookie.secure=${COOKIE_SECURE:false}

# Guest retention: a daily sweep deletes guest accounts with no activity for
# N days (and everything they own) — free Postgres tiers are small.
# ADMIN_SECRET (optional) lets an external cron trigger the sweep manually
# when the host can't run @Scheduled (e.g. scale-to-zero platforms).
app.guest-retention-days=${GUEST_RETENTION_DAYS:7}
app.guest-cleanup-cron=${GUEST_CLEANUP_CRON:0 17 3 * * *}
app.admin-secret=${ADMIN_SECRET:}

# TMDB proxy — key + read token come from .env (never committed). The
# frontend calls /api/tmdb/**, which forwards to TMDB with these credentials.
# The read access token (v4) also works as a Bearer token on the v3 API,
# which keeps the key out of the query string entirely.
tmdb.base-url=https://api.themoviedb.org/3
tmdb.read-access-token=${TMDB_READ_ACCESS_TOKEN}

# OpenSubtitles subtitle proxy — key from .env (free at opensubtitles.com/consumers).
# Files are cached on disk because the download links expire and the daily
# quota is small. vault:streaming-providers-deep-dive#subtitles
opensubtitles.api-key=${OPENSUBTITLES_API_KEY:}
# Relative to the process's working directory unless given an absolute path —
# point this at an SSD instead of the SD card if the two differ.
app.subtitle-cache-dir=${SUBTITLE_CACHE_DIR:data/subtitles}

# Only /actuator/health is exposed (permitAll in SecurityConfig) — every other
# actuator endpoint (env, beans, etc.) stays off, including from an
# authenticated session. show-details=always is what makes the per-component
# breakdown (/actuator/health/db) resolve at all — without it the endpoint
# only ever answers the single aggregate UP/DOWN.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
