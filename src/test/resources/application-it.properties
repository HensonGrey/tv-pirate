# Integration-test profile: the repository tier runs against a REAL Postgres.
# Two things in this schema cannot be proven any other way — the two *partial*
# unique indexes on watch_progress (one WHERE season_number IS NOT NULL, one
# WHERE IS NULL) and the users.last_activity_at triggers. Mocks and H2 both
# pass while production breaks. vault:testing-deep-dive#db-tier
#
# It is a SEPARATE database, never the dev one, so no test can reach real data.
# Create it once per machine:
#   psql -U postgres -c 'CREATE DATABASE "tv-pirate-test"'
#
# Classes on this profile are named *IT. Maven surefire's default includes are
# only Test*/*Test/*Tests/*TestCase, so ./mvnw test and ./mvnw package stay
# database-free — run this tier explicitly with -Dtest='*IT'.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT}/tv-pirate-test

# Liquibase builds this schema from zero, so the migrations themselves get
# exercised — a bad precondition surfaces in a test rather than in production.
spring.liquibase.enabled=true
# Still validate-only: entities are checked against the migrated schema, and a
# drift between the two fails the run instead of being silently patched.
spring.jpa.hibernate.ddl-auto=validate

# "-" is Spring's cron-disabled sentinel — the daily guest sweep deletes users,
# so it must never fire in the middle of a test.
app.guest-cleanup-cron=-

# Credentials come from backend/.env via the spring.config.import in
# application.properties; only the database name differs from dev.
