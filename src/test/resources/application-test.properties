# Lets ./mvnw package build without a live database or a real .env — the
# only test today just checks the context loads, so nothing here needs to
# actually reach Postgres or TMDB. Liquibase and Hibernate's schema
# validation both need a live connection, so both are turned off; Hikari's
# own startup connectivity check is disabled too so the DataSource bean can
# be created without one.
spring.liquibase.enabled=false
spring.jpa.hibernate.ddl-auto=none
# ddl-auto=none alone isn't enough — Hibernate still probes a live connection
# to auto-detect the SQL dialect unless told explicitly.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:postgresql://localhost:1/unreachable-on-purpose
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.hikari.initialization-fail-timeout=-1
jwt.secret=test-only-secret-not-used-for-anything-real
tmdb.read-access-token=test-only-placeholder-token
